[package]
name = "alseye-cross"
version = "0.1.0"
edition = "2021"
authors = ["ALSEYE Reverse Engineering Project"]
description = "Cross-platform hardware monitor and TFT cooler screen controller"

[dependencies]
# GUI Framework (Hardware accelerated & native on Linux/Windows)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

# Hardware Sensor Reading
sysinfo = "0.31"

# USB HID Communication
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency & time
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"

